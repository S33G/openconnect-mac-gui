name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --disable-sandbox
      - name: Test session supervisor
        run: python3 -m unittest discover -s Tests/SessionBridgeTests -v
      - name: Build app
        run: scripts/build-app.sh
      - name: Check bundle
        run: |
          plutil -lint 'dist/OpenConnect Mac GUI.app/Contents/Info.plist'
          codesign --verify --deep --strict 'dist/OpenConnect Mac GUI.app'
          test "$(find 'dist/OpenConnect Mac GUI.app/Contents/MacOS' -type f | wc -l | tr -d ' ')" = 1
      - name: Archive development app
        run: ditto -c -k --keepParent 'dist/OpenConnect Mac GUI.app' dist/OpenConnect-Mac-GUI-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenConnect-Mac-GUI-development
          path: dist/OpenConnect-Mac-GUI-development.zip
